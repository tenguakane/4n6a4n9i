<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Смены няни</title>
<meta name="theme-color" content="#f2f2f7" id="themeColor">
<script>(function(){try{var t=localStorage.getItem("nanny.theme")||"system";if(t==="system")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="application-name" content="Смены няни">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Смены няни">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--card2:#f2f2f7;--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.2);
  --tx:#000;--tx2:rgba(60,60,67,.6);--tx3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.18);
  --acc:#ff375f;--accS:rgba(255,55,95,.12);
  --day:#ff9f0a;--eve:#5e5ce6;--cus:#0a84ff;--wknd:#8e8e93;--sick:#ff3b30;--vac:#34c759;--kid:#ff2d55;
  --ok:#34c759;--bad:#ff3b30;
  --bar:rgba(249,249,249,.86);--segOn:#fff;--g1:#ff5f7e;--g2:#ff375f;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
/* ---------- тёмные темы ---------- */
:root[data-theme="dark"]{
  --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);
  --tx:#fff;--tx2:rgba(235,235,245,.6);--tx3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.55);
  --acc:#ff375f;--accS:rgba(255,55,95,.2);--bar:rgba(22,22,24,.86);--segOn:#636366;--g1:#ff5f7e;--g2:#ff375f;color-scheme:dark;
}
:root[data-theme="graphite"]{
  --bg:#111214;--card:#1d1f23;--card2:#282b31;--fill:rgba(140,150,170,.16);--fill2:rgba(140,150,170,.28);
  --tx:#f2f4f7;--tx2:rgba(220,226,236,.6);--tx3:rgba(220,226,236,.3);--sep:rgba(140,150,170,.2);
  --acc:#2ec4b6;--accS:rgba(46,196,182,.18);--bar:rgba(22,24,28,.88);--segOn:#3a3e46;--g1:#2ec4b6;--g2:#1a8f9c;color-scheme:dark;
}
:root[data-theme="midnight"]{
  --bg:#070b17;--card:#111a2e;--card2:#1a2542;--fill:rgba(120,150,230,.15);--fill2:rgba(120,150,230,.26);
  --tx:#eef3ff;--tx2:rgba(210,222,255,.6);--tx3:rgba(210,222,255,.3);--sep:rgba(120,150,230,.2);
  --acc:#4f8cff;--accS:rgba(79,140,255,.2);--bar:rgba(10,16,32,.88);--segOn:#2a3a63;--g1:#4f8cff;--g2:#6a5cff;color-scheme:dark;
}
:root[data-theme="violet"]{
  --bg:#0e0919;--card:#1a1230;--card2:#251a42;--fill:rgba(167,139,250,.14);--fill2:rgba(167,139,250,.25);
  --tx:#f4f0ff;--tx2:rgba(226,216,255,.62);--tx3:rgba(226,216,255,.32);--sep:rgba(167,139,250,.2);
  --acc:#9d7bff;--accS:rgba(157,123,255,.2);--bar:rgba(17,11,33,.88);--segOn:#3d2d68;--g1:#8b5cf6;--g2:#c026d3;color-scheme:dark;
  --eve:#bf5af2;
}
:root[data-theme="fox"]{
  --bg:#130c07;--card:#21150d;--card2:#2d1d12;--fill:rgba(255,159,69,.12);--fill2:rgba(255,159,69,.22);
  --tx:#fff4ea;--tx2:rgba(255,228,205,.62);--tx3:rgba(255,228,205,.3);--sep:rgba(255,159,69,.17);
  --acc:#ff8a2a;--accS:rgba(255,138,42,.18);--bar:rgba(25,16,9,.9);--segOn:#4a2f1c;--g1:#ffb056;--g2:#f0602a;color-scheme:dark;
  --day:#ffc23d;
}
:root:not([data-theme="light"]) .seg button.on{box-shadow:0 3px 8px rgba(0,0,0,.35)}
:root[data-theme="fox"] body{background:radial-gradient(700px 420px at 100% -8%,rgba(255,138,42,.16),transparent 70%),var(--bg) fixed}
:root[data-theme="violet"] body{background:radial-gradient(700px 420px at 100% -8%,rgba(157,123,255,.2),transparent 70%),var(--bg) fixed}
:root[data-theme="midnight"] body{background:radial-gradient(700px 420px at 100% -8%,rgba(79,140,255,.16),transparent 70%),var(--bg) fixed}
:root:not([data-theme="light"]){color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

/* ---------- выбор темы ---------- */
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}
.th{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--tx)}
.th .pv{position:relative;width:100%;aspect-ratio:1/1.15;border-radius:14px;overflow:hidden;border:2px solid transparent;box-shadow:0 0 0 .5px var(--sep)}
.th.on .pv{border-color:var(--acc)}
.th .pv i{position:absolute;left:12%;right:12%;height:13%;border-radius:5px}
.th .pv b{position:absolute;left:12%;width:34%;height:9%;border-radius:99px;bottom:12%}
.th .pv .ck{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--acc);color:#fff;display:none;place-items:center;font-size:12px;font-weight:800}
.th.on .pv .ck{display:grid}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.3 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{border:0;background:none;outline:none;min-width:0}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none}
.hidden{display:none!important}

/* ---------- каркас ---------- */
#view{padding:calc(env(safe-area-inset-top,0px) + 8px) 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 4px 10px}
.lt>div:first-child{min-width:0;flex:1}.lt .navb{flex:none}
.lt h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;font-size:clamp(26px,8vw,34px);line-height:1.15;font-weight:700;letter-spacing:.01em}
.lt .sub{color:var(--tx2);font-size:15px;margin-top:2px}
.navb{display:flex;gap:6px;align-items:center}
.icbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--acc)}
.icbtn svg{width:20px;height:20px}
.sync{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--tx2);padding:6px 10px;border-radius:99px;background:var(--fill)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.sync[data-s="off"] i{background:var(--tx3)}
.sync[data-s="err"] i{background:var(--day)}
.sync[data-s="busy"] i{background:var(--cus);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--tx2);padding:2px 0}
.tabbar button svg{width:26px;height:26px}
.tabbar button.on{color:var(--acc)}

/* ---------- группы и ячейки ---------- */
.gh{font-size:13px;color:var(--tx2);text-transform:uppercase;letter-spacing:.02em;padding:18px 16px 7px}
.gf{font-size:13px;color:var(--tx2);padding:7px 16px 0;line-height:1.35}
.grp{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:46px;padding:9px 16px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row.ind+.row::before,.row+.row.ind::before{left:58px}
.row .lb{flex:1;min-width:0}
.row .lb small{display:block;color:var(--tx2);font-size:13px;margin-top:1px}
.row .val{color:var(--tx2);text-align:right;white-space:nowrap}
.row input.val,.row select.val{color:var(--tx2);text-align:right;flex:0 1 auto;width:auto;max-width:60%}
.row input.val:focus{color:var(--tx)}
.row input[type=number].val{width:110px}
.row.tap{cursor:pointer}
.row.tap:active{background:var(--fill)}
.chev{color:var(--tx3);font-size:20px;line-height:1;margin-left:-4px}
.ico{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none;font-size:15px;font-weight:700}
.ico svg{width:18px;height:18px}
.full{width:100%}
.link{color:var(--acc)}
.danger{color:var(--bad)!important}
.muted{color:var(--tx2)}
.spacer{height:14px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;font-size:17px;padding:0 16px}
.btn:active{opacity:.75}
.btn.sec{background:var(--accS);color:var(--acc)}
.btn.gray{background:var(--fill);color:var(--tx)}
.btn.sm{min-height:36px;width:auto;font-size:15px;border-radius:9px;padding:0 12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btns{display:flex;gap:10px}
.btns>.btn{flex:1}

.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;min-height:32px;border-radius:7px;font-size:14px;font-weight:500;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--segOn);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
.segw{padding:8px 0}

.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--fill2);transition:background .2s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .2s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(20px)}

.stepper{display:flex;align-items:center;gap:0;background:var(--fill);border-radius:9px;overflow:hidden}
.stepper button{width:44px;height:34px;font-size:22px;color:var(--tx);display:grid;place-items:center}
.stepper button:active{background:var(--fill2)}
.stepper input{width:64px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;border-left:.5px solid var(--sep);border-right:.5px solid var(--sep);height:34px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:13px;font-weight:600;color:#fff;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--kid);background:color-mix(in srgb,var(--kid) 14%,transparent);padding:2px 7px;border-radius:99px}
.tag{font-size:12px;font-weight:600;color:var(--day);background:color-mix(in srgb,var(--day) 15%,transparent);padding:2px 7px;border-radius:99px}

/* ---------- календарь ---------- */
.mhead{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px}
.mhead b{font-size:20px;font-weight:700;text-transform:capitalize}
.mnav{display:flex;gap:8px}
.cal{background:var(--card);border-radius:14px;padding:10px 6px 8px}
.cal .wd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;font-weight:600;color:var(--tx2);text-transform:uppercase;padding-bottom:6px}
.cal .gr{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px}
.cd{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 1px 5px;border-radius:10px;min-height:62px;cursor:pointer}
.cd .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-variant-numeric:tabular-nums}
.cd.out{opacity:.28}
.cd.td .n{color:var(--acc);font-weight:700}
.cd.sel .n{background:var(--acc);color:#fff;font-weight:700}
.cd .sh{max-width:100%;font-size:10px;font-weight:700;color:#fff;border-radius:5px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.cd .of{position:absolute;left:3px;right:3px;bottom:2px;height:3px;border-radius:2px}
.cd.off{background:color-mix(in srgb,var(--c) 11%,transparent)}
.cd .kid{position:absolute;top:3px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--kid)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 6px 0;font-size:13px;color:var(--tx2)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* ---------- статистика ---------- */
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kp .k{background:var(--card);border-radius:14px;padding:13px 14px}
.kp .k span{font-size:13px;color:var(--tx2);font-weight:500}
.kp .k b{display:block;font-size:26px;font-weight:700;margin-top:3px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kp .k.wide{grid-column:1/-1}
.kp .k.acc{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.kp .k.acc span{color:rgba(255,255,255,.85)}
.bar3{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--fill);margin-top:10px}
.bar3 i{display:block;height:100%}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 2px 0}
.pnav b{font-size:16px;font-weight:600;text-align:center;flex:1}
.num{font-variant-numeric:tabular-nums}

/* ---------- шторка ---------- */
#sheetRoot{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheetRoot.on{pointer-events:auto}
.bd{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;transition:opacity .28s}
#sheetRoot.on .bd{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - env(safe-area-inset-top,0px) - 12px);background:var(--bg);border-radius:14px 14px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;max-width:640px;margin:0 auto}
#sheetRoot.on .sheet{transform:none}
.sheet .sh-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;position:relative}
.sheet .sh-h::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:5px;border-radius:3px;background:var(--fill2);transform:translateX(-50%)}
.sheet .sh-h b{font-size:17px;font-weight:600;position:absolute;left:70px;right:70px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .sh-h button{font-size:17px;color:var(--acc);min-width:60px;text-align:left;padding:6px 0}
.sheet .sh-h button.r{text-align:right;font-weight:600}
.sheet .sh-b{overflow:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.prev{display:block;width:100%;border-radius:12px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:rgba(30,30,32,.94);color:#fff;font-size:15px;font-weight:500;padding:11px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:80;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- вход ---------- */
.welcome{min-height:calc(100dvh - 40px);display:flex;flex-direction:column;justify-content:center;gap:10px;padding:20px 0}
.logo{width:96px;height:96px;border-radius:22px;margin:0 auto 6px;box-shadow:0 10px 30px rgba(255,55,95,.3)}
.welcome h1{text-align:center;font-size:30px;margin:6px 0 0}
.welcome p.c{text-align:center;color:var(--tx2);margin:4px 12px 18px;font-size:16px}
.pin{letter-spacing:.4em;font-size:22px!important;text-align:center!important;width:100%!important;max-width:none!important;color:var(--tx)!important}
details.help{background:var(--card);border-radius:12px;padding:12px 16px;margin-top:10px;font-size:15px}
details.help summary{color:var(--acc);font-weight:500;cursor:pointer;list-style:none}
details.help summary::-webkit-details-marker{display:none}
details.help ol{padding-left:20px;margin:10px 0 0;color:var(--tx2)}
details.help li{margin:6px 0}
details.help code{font-size:12.5px;background:var(--fill);padding:2px 5px;border-radius:5px;word-break:break-all;color:var(--tx)}
.empty{text-align:center;color:var(--tx2);padding:22px 16px;font-size:15px}
</style>
</head>
<body>
<main id="view"></main>
<nav class="tabbar hidden" id="tabbar"></nav>
<div id="sheetRoot"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileImp" accept=".json,application/json" hidden>

<script>
"use strict";
/* =================== утилиты =================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k){ try { localStorage.removeItem(k); } catch (e) {} }
};
function rid(n = 12){ const a = "abcdefghijkmnopqrstuvwxyz23456789", b = new Uint8Array(n); crypto.getRandomValues(b); return [...b].map(x => a[x % a.length]).join(""); }
function hash(str){ // cyrb53 ×2 — одинаково на всех устройствах
  const h = seed => { let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed; for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16).padStart(14, "0"); };
  return h(7) + h(1337);
}
const pinHash = (role, pin) => hash(`${D.settings.salt}:${role}:${String(pin).trim()}`);
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2300); }
const vib = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} };
const b64e = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))));

/* даты */
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return iso(d); };
const today = () => iso(new Date());
const weekStart = s => { const d = pd(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); };
const monthStart = s => s.slice(0, 8) + "01";
const monthEnd = s => { const d = pd(monthStart(s)); d.setMonth(d.getMonth() + 1, 0); return iso(d); };
const addMonths = (s, n) => { const d = pd(monthStart(s)); d.setMonth(d.getMonth() + n); return iso(d); };
const MON = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const MONG = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MONS = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const WD = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const WDL = ["понедельник","вторник","среда","четверг","пятница","суббота","воскресенье"];
const wdi = s => (pd(s).getDay() + 6) % 7;
const dShort = s => { const d = pd(s); return `${d.getDate()} ${MONS[d.getMonth()]}`; };
const dLong = s => { const d = pd(s); return `${d.getDate()} ${MONG[d.getMonth()]}`; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const monthTitle = s => { const d = pd(s); return `${cap(MON[d.getMonth()])} ${d.getFullYear()}`; };
function rangeLabel(a, b){
  const A = pd(a), B = pd(b);
  if (a === b) return dLong(a);
  if (A.getMonth() === B.getMonth() && A.getFullYear() === B.getFullYear()) return `${A.getDate()}–${B.getDate()} ${MONG[B.getMonth()]}`;
  return `${dShort(a)} – ${dShort(b)}`;
}
function plural(n, a, b, c){ n = Math.abs(n) % 100; const k = n % 10; if (n > 10 && n < 20) return c; if (k > 1 && k < 5) return b; if (k === 1) return a; return c; }

/* числа */
const r2 = x => Math.round(x * 100) / 100;
const r4 = x => Math.round(x * 1e4) / 1e4;
// Часы показываем часами и минутами: 50 мин, 8 ч, 1 ч 50 мин.
const fH = h => { const t = Math.round(hNum(h) * 60), a = Math.abs(t), hh = Math.floor(a / 60), mm = a % 60, sg = t < 0 ? "−" : "";
  return sg + (hh && mm ? `${hh} ч ${mm} мин` : hh ? `${hh} ч` : `${mm} мин`); };
// В полях ввода: целые и половинки — числом (8, 8,5), остальное — как время (0:50).
const fN = h => { const t = Math.round(hNum(h) * 60); return t % 30 === 0 ? (t / 60).toLocaleString("ru-RU") : `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; };
const fM = x => `${Math.round(x).toLocaleString("ru-RU")} ${D?.settings?.cur || "₴"}`;
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
// Часы можно вводить и дробью (0,5), и как время (0:50 = 50 минут).
const hNum = v => { const t = String(v ?? "").trim(), m = t.match(/^(\d+)\s*[:.ч]\s*(\d{1,2})\s*(мин)?$/i);
  if (m && (t.includes(":") || /ч/i.test(t))) return +m[1] + Math.min(59, +m[2]) / 60; return num(t); };

const oKey = () => `nanny.ops.${S.room}`;

function blank(){
  return { v: 1, created: Date.now(),
    settings: { name: "Няня", cur: "₴", rates: { base: 100, over: 150, sick: 150 }, norms: { day: 8, evening: 5 }, auth: {}, salt: rid(16) },
    shifts: {}, off: {}, pays: {} };
}
function norm(d){
  d = d && typeof d === "object" ? d : blank();
  const b = blank();
  d.settings = Object.assign(b.settings, d.settings || {});
  d.settings.rates = Object.assign({ base: 100, over: 150, sick: 150 }, d.settings.rates || {});
  d.settings.norms = Object.assign({ day: 8, evening: 5 }, d.settings.norms || {});
  d.settings.auth = d.settings.auth || {};
  for (const k of ["shifts", "off", "pays"]) d[k] = d[k] && typeof d[k] === "object" ? d[k] : {};
  return d;
}
function setPath(obj, path, val){
  const p = path.split("/").filter(Boolean); let o = obj;
  for (let i = 0; i < p.length - 1; i++) { if (!o[p[i]] || typeof o[p[i]] !== "object") o[p[i]] = {}; o = o[p[i]]; }
  if (val == null) delete o[p[p.length - 1]]; else o[p[p.length - 1]] = val;
}
const saveLocal = () => LS.set(dKey(), D);
const cloudOn = () => !!(S && S.url);
const isMgr = () => S && S.role === "mgr";

/* =================== облако (Firebase Realtime Database, REST) =================== */
const SYNC = { st: "off", es: null, t: 0, busy: false };
function setSync(st){ SYNC.st = st; const el = $("#sync"); if (el) { el.dataset.s = st; el.lastChild.textContent = syncText(); } }
const syncText = () => !cloudOn() ? "Локально" : SYNC.st === "ok" ? "Облако" : SYNC.st === "busy" ? "Синхронизация" : SYNC.st === "err" ? "Нет связи" : "Облако";
const cUrl = (path = "") => `${S.url}/rooms/${S.room}${path ? "/" + path : ""}.json`;
async function cGet(url = S.url, room = S.room){
  const r = await fetch(`${url}/rooms/${room}.json`, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? "Нет доступа к базе. Проверь правила (Rules) в Firebase." : `Ошибка облака ${r.status}`);
  return await r.json();
}
async function cSend(method, path, val){
  const r = await fetch(cUrl(path), { method, headers: { "Content-Type": "application/json" }, body: val === undefined ? undefined : JSON.stringify(val) });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
}
function write(path, val){
  setPath(D, path, val); saveLocal();
  if (cloudOn()) { const ops = LS.get(oKey(), []); ops.push({ path, val: val ?? null }); LS.set(oKey(), ops); flush(); }
}
async function flush(){
  if (!cloudOn() || SYNC.busy) return;
  let ops = LS.get(oKey(), []); if (!ops.length) { setSync("ok"); return; }
  SYNC.busy = true; setSync("busy");
  try {
    while (ops.length) {
      const op = ops[0];
      if (op.val == null) await cSend("DELETE", op.path); else await cSend("PUT", op.path, op.val);
      ops = LS.get(oKey(), []); ops.shift(); LS.set(oKey(), ops);
    }
    setSync("ok");
  } catch (e) { setSync("err"); clearTimeout(flush.t); flush.t = setTimeout(flush, 8000); }
  finally { SYNC.busy = false; }
}
async function pull(){
  if (!cloudOn()) return;
  try {
    const remote = await cGet();
    if (!remote) { setSync("err"); return; }
    const d = norm(remote);
    for (const op of LS.get(oKey(), [])) setPath(d, op.path, op.val);
    const changed = JSON.stringify(d) !== JSON.stringify(D);
    D = d; saveLocal();
    if (!SYNC.busy) setSync(LS.get(oKey(), []).length ? "busy" : "ok");
    if (changed) render(true);
  } catch (e) { setSync("err"); }
}
const pullSoon = () => { clearTimeout(SYNC.t); SYNC.t = setTimeout(pull, 350); };
function startLive(){
  stopLive(); if (!cloudOn()) { setSync("off"); return; }
  try { SYNC.es = new EventSource(cUrl()); ["put", "patch"].forEach(ev => SYNC.es.addEventListener(ev, pullSoon)); } catch (e) {}
  pull(); flush();
}
function stopLive(){ if (SYNC.es) { try { SYNC.es.close(); } catch (e) {} SYNC.es = null; } }
setInterval(() => { if (document.visibilityState === "visible" && S && S.role) { pull(); flush(); } }, 30000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S && S.role) { pull(); flush(); } });
addEventListener("online", () => { if (S && S.role) { flush(); pull(); } });
function cleanUrl(u){
  u = String(u || "").trim().replace(/\/+$/, "").replace(/\.json$/, "");
  if (!u) return "";
  if (!/^https:\/\//i.test(u)) u = "https://" + u.replace(/^\w+:\/\//, "");
  return /^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)$/i.test(u) ? u : null;
}
const inviteLink = () => `${location.origin === "null" ? "" : location.origin}${location.pathname}#join=${b64e(JSON.stringify({ u: S.url, r: S.room }))}`;

/* =================== расчёты =================== */
const KIND = { day: "Дневная", evening: "Вечерняя", custom: "По часам" };
const KCOL = { day: "var(--day)", evening: "var(--eve)", custom: "var(--cus)" };
const KHEX = { day: "#ff9f0a", evening: "#5e5ce6", custom: "#0a84ff" };
const OFF = { weekend: "Выходной", sick: "Больничный", vacation: "Отпуск" };
const OCOL = { weekend: "var(--wknd)", sick: "var(--sick)", vacation: "var(--vac)" };
const OHEX = { weekend: "#8e8e93", sick: "#ff3b30", vacation: "#34c759" };
const PAYK = { advance: "Аванс", salary: "Зарплата" };
const hShort = t => { const [h, m] = t.split(":"); return m === "00" ? String(+h) : `${+h}:${m}`; };
const sLabel = s => s.kind === "custom" ? `${s.start}–${s.end}` : KIND[s.kind];
const sShort = s => s.kind === "custom" ? `${hShort(s.start)}–${hShort(s.end)}` : s.kind === "day" ? "Дн" : "Веч";
function spanHours(a, b){ if (!a || !b) return 0; const [h1, m1] = a.split(":").map(Number), [h2, m2] = b.split(":").map(Number); let m = h2 * 60 + m2 - (h1 * 60 + m1); if (m <= 0) m += 1440; return r4(m / 60); }
const hrs = s => s.actual != null && s.actual !== "" ? hNum(s.actual) : hNum(s.norm);
function calc(s){
  const r = s.rates || D.settings.rates, h = hrs(s), n = hNum(s.norm);
  const reg = Math.min(h, n), ot = Math.max(0, r4(h - n));
  const regRate = s.sick ? +r.sick : +r.base, otRate = s.sick ? Math.max(+r.over, +r.sick) : +r.over;
  return { h, reg, ot, regRate, otRate, regSum: reg * regRate, otSum: ot * otRate, sum: reg * regRate + ot * otRate, done: s.actual != null && s.actual !== "" };
}
const shiftsArr = () => Object.entries(D.shifts).map(([id, s]) => ({ id, ...s })).sort((a, b) => a.date.localeCompare(b.date) || (a.start || "").localeCompare(b.start || ""));
const offArr = () => Object.entries(D.off).map(([id, o]) => ({ id, ...o })).sort((a, b) => a.from.localeCompare(b.from));
const paysArr = () => Object.entries(D.pays).map(([id, p]) => ({ id, ...p })).sort((a, b) => b.date.localeCompare(a.date) || (b.at || 0) - (a.at || 0));
const shiftsOn = d => shiftsArr().filter(s => s.date === d);
const offOn = d => offArr().filter(o => o.from <= d && d <= o.to);
function period(mode, ref){
  if (mode === "week") { const a = weekStart(ref); return { from: a, to: addDays(a, 6), label: rangeLabel(a, addDays(a, 6)) }; }
  if (mode === "month") return { from: monthStart(ref), to: monthEnd(ref), label: monthTitle(ref) };
  return { from: "0000-01-01", to: "9999-12-31", label: "За всё время" };
}
function agg(p){
  const t = today(), A = { h: 0, reg: 0, ot: 0, sickH: 0, regSum: 0, otSum: 0, sickSum: 0, sum: 0, n: 0, open: 0, planH: 0, planN: 0, list: [] };
  for (const s of shiftsArr()) {
    if (s.date < p.from || s.date > p.to) continue;
    if (s.date > t) { A.planH += hrs(s); A.planN++; continue; }
    const c = calc(s); A.n++; A.h += c.h; A.ot += c.ot; A.otSum += c.otSum; A.sum += c.sum;
    if (s.sick) { A.sickH += c.reg; A.sickSum += c.regSum; } else { A.reg += c.reg; A.regSum += c.regSum; }
    if (!c.done) A.open++;
    A.list.push({ s, c });
  }
  A.offDays = { weekend: 0, sick: 0, vacation: 0 };
  for (const o of offArr()) { const a = o.from > p.from ? o.from : p.from, b = o.to < p.to ? o.to : p.to; if (a > b) continue; A.offDays[o.kind] += Math.round((pd(b) - pd(a)) / 864e5) + 1; }
  A.paid = paysArr().filter(x => x.date >= p.from && x.date <= p.to).reduce((s, x) => s + +x.amount, 0);
  return A;
}
function balance(){
  const t = today(); let earned = 0;
  for (const s of shiftsArr()) if (s.date <= t) earned += calc(s).sum;
  const paid = paysArr().reduce((s, x) => s + +x.amount, 0);
  return { earned, paid, due: earned - paid };
}

function shiftRow(s){

function offRow(o){

/* ---------- Календарь ---------- */

    cells += `<div class="${cls}" data-act="day" data-v="${d}" ${o ? `style="--c:${OCOL[o.kind]}"` : ""}><span class="n">${pd(d).getDate()}</span>
      ${sh.slice(0, 2).map(s => `<span class="sh" style="background:${KCOL[s.kind]}">${esc(sShort(s))}</span>`).join("")}
      ${o ? `<span class="of" style="background:${OCOL[o.kind]}"></span>` : ""}${sh.some(s => s.sick) ? `<span class="kid"></span>` : ""}</div>`;
  }

  h += `<div class="cal"><div class="wd">${WD.map(w => `<span>${w}</span>`).join("")}</div><div class="gr">${cells}</div>
    <div class="legend"><span><i class="dot" style="background:var(--day)"></i>Дневная</span><span><i class="dot" style="background:var(--eve)"></i>Вечерняя</span><span><i class="dot" style="background:var(--cus)"></i>По часам</span><span><i class="dot" style="background:var(--wknd)"></i>Выходной</span><span><i class="dot" style="background:var(--sick)"></i>Больничный</span><span><i class="dot" style="background:var(--vac)"></i>Отпуск</span><span><i class="dot" style="background:var(--kid)"></i>Ребёнок болеет</span></div></div>`;

  if (!sh.length && !of.length) h += `<div class="empty">Смен нет</div>`;
  h += sh.map(s => { const c = calc(s); return `<div class="row tap ind" data-act="${isMgr() ? "editShift" : "viewShift"}" data-id="${s.id}">
      <span class="ico" style="background:${KCOL[s.kind]}">${s.kind === "custom" ? "Ч" : s.kind === "day" ? "Д" : "В"}</span>
      <span class="lb">${esc(sLabel(s))}${s.sick ? ` <span class="badge">болеет</span>` : ""}<small>${c.done ? `Отработано ${fH(c.h)} из ${fH(s.norm)}${c.ot ? ` · переработка ${fH(c.ot)}` : c.h < hNum(s.norm) ? ` · недоработка ${fH(hNum(s.norm) - c.h)}` : ""}` : `Норма ${fH(s.norm)}${s.date <= today() ? " · итог не указан" : ""}`}</small></span>
      <span class="val num">${fM(c.sum)}</span><span class="chev">›</span></div>`; }).join("");
  h += of.map(offRow).join("") + `</div>`;
  if (isMgr()) h += `<div class="spacer"></div><div class="btns"><button class="btn sec" data-act="quickShift">＋ Смена</button><button class="btn gray" data-act="quickOff">＋ Выходной…</button></div>`;
  // итоги месяца
  const A = agg(period("month", m));
  h += `<div class="gh">Итоги за ${MON[pd(m).getMonth()]}</div><div class="grp">
    <div class="row"><span class="lb">Отработано смен</span><span class="val num">${A.n}</span></div>

}

const themePref = () => { try { return localStorage.getItem("nanny.theme") || "system"; } catch (e) { return "system"; } };
function applyTheme(){
  let t = themePref(); if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";

/* =================== картинки (canvas) =================== */
const IMG = { W: 540, k: 2, bg: "#f2f2f7", card: "#ffffff", tx: "#1c1c1e", mu: "#8a8a8e", sep: "#e5e5ea", acc: "#ff375f", font: '-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif' };
function hexA(hex, a){ const m = String(hex).trim().match(/^#([0-9a-f]{6})$/i); if (!m) return hex; const n = parseInt(m[1], 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function imgTheme(){ // цвета картинки = цвета текущей темы приложения
  const cs = getComputedStyle(document.documentElement), v = k => cs.getPropertyValue(k).trim();
  const t = document.documentElement.getAttribute("data-theme") || "light";
  Object.assign(IMG, { bg: v("--bg"), card: v("--card"), tx: v("--tx"), mu: v("--tx2"), mu2: v("--tx3"), sep: v("--sep"), acc: v("--acc"), g1: v("--g1"), g2: v("--g2"), kid: v("--kid"), dark: t !== "light",
    glow: { fox: .22, violet: .26, midnight: .2 }[t] || 0,
    kc: { day: v("--day"), evening: v("--eve"), custom: v("--cus") }, oc: { weekend: v("--wknd"), sick: v("--sick"), vacation: v("--vac") } });
}
function mkCanvas(h){ const c = document.createElement("canvas"); c.width = IMG.W * IMG.k; c.height = Math.ceil(h * IMG.k); const x = c.getContext("2d"); x.scale(IMG.k, IMG.k); x.fillStyle = IMG.bg; x.fillRect(0, 0, IMG.W, h); if (IMG.glow) { const g = x.createRadialGradient(IMG.W, -20, 0, IMG.W, -20, 420); g.addColorStop(0, hexA(IMG.acc, IMG.glow)); g.addColorStop(1, hexA(IMG.acc, 0)); x.fillStyle = g; x.fillRect(0, 0, IMG.W, Math.min(h, 460)); } x.textBaseline = "alphabetic"; return [c, x]; }
const F = (w, s) => `${w} ${s}px ${IMG.font}`;
function rr(x, X, Y, w, h, r, fill){ x.beginPath(); if (x.roundRect) x.roundRect(X, Y, w, h, r); else { x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); } if (fill) { x.fillStyle = fill; x.fill(); } }
function tx(x, s, X, Y, font, col, align = "left", maxW){ x.font = font; x.fillStyle = col; x.textAlign = align; let t = String(s); if (maxW) { while (t.length > 1 && x.measureText(t).width > maxW) t = t.slice(0, -2) + "…"; } x.fillText(t, X, Y); return x.measureText(t).width; }
function pillC(x, s, X, Y, col, font = F(700, 13), h = 24, align = "left"){ x.font = font; const w = x.measureText(s).width + 18; const L = align === "right" ? X - w : X; rr(x, L, Y, w, h, h / 2, col); tx(x, s, L + 9, Y + h / 2 + 4.6, font, "#fff"); return w; }
function header(x, title, sub){ tx(x, title, 24, 52, F(800, 27), IMG.tx); tx(x, sub, 24, 78, F(500, 15), IMG.mu, "left", IMG.W - 48); }
function footer(x, h){ tx(x, "Смены няни", IMG.W / 2, h - 18, F(500, 11.5), IMG.mu2, "center"); }
function imgWeek(ref){
  const a = weekStart(ref), rowH = 60, top = 100, h = top + rowH * 7 + 16 + 64 + 44;
  const [c, x] = mkCanvas(h);
  header(x, "График на неделю", `${rangeLabel(a, addDays(a, 6))} ${pd(addDays(a, 6)).getFullYear()} · ${D.settings.name}`);
  rr(x, 16, top, IMG.W - 32, rowH * 7, 16, IMG.card);
  let H = 0, N = 0;
  for (let i = 0; i < 7; i++) {
    const d = addDays(a, i), y = top + i * rowH, sh = shiftsOn(d), of = offOn(d), isT = d === today();
    if (i) { x.fillStyle = IMG.sep; x.fillRect(32, y, IMG.W - 64, 1); }
    tx(x, WD[i], 32, y + 27, F(700, 16), i > 4 ? IMG.acc : IMG.tx);
    tx(x, dShort(d), 32, y + 46, F(500, 13), IMG.mu);
    if (isT) { rr(x, 22, y + 14, 4, 32, 2, IMG.acc); }
    let X = 104;
    for (const s of sh) { X += pillC(x, sLabel(s), X, y + 18, IMG.kc[s.kind]) + 6; if (s.sick) X += pillC(x, "болеет", X, y + 18, IMG.kid) + 6; H += hrs(s); N++; }
    for (const o of of) X += pillC(x, OFF[o.kind], X, y + 18, IMG.oc[o.kind]) + 6;
    if (!sh.length && !of.length) tx(x, "—", 104, y + 36, F(500, 15), IMG.mu2);
    if (sh.length) tx(x, fH(sh.reduce((t, s) => t + hrs(s), 0)), IMG.W - 32, y + 36, F(700, 16), IMG.tx, "right");
  }
  const y2 = top + rowH * 7 + 16;
  rr(x, 16, y2, IMG.W - 32, 64, 16, IMG.card);
  tx(x, "Итого", 32, y2 + 38, F(600, 16), IMG.mu);
  tx(x, `${N} ${plural(N, "смена", "смены", "смен")} · ${fH(H)}`, IMG.W - 32, y2 + 39, F(800, 19), IMG.tx, "right");
  footer(x, h); return c;
}
function imgMonth(ref){
  const m = monthStart(ref), s0 = weekStart(m), e0 = addDays(weekStart(monthEnd(m)), 6);
  const weeks = Math.round((pd(e0) - pd(s0)) / 864e5 + 1) / 7, cw = (IMG.W - 32) / 7, ch = 74, top = 128;
  const h = top + weeks * ch + 18 + 64 + 64 + 40;
  const [c, x] = mkCanvas(h);
  header(x, `График · ${monthTitle(m)}`, D.settings.name);
  rr(x, 16, 96, IMG.W - 32, weeks * ch + 32 + 8, 16, IMG.card);
  WD.forEach((w, i) => tx(x, w.toUpperCase(), 16 + cw * i + cw / 2, 118, F(700, 11), i > 4 ? IMG.acc : IMG.mu, "center"));
  let H = 0, N = 0, i = 0;
  for (let d = s0; d <= e0; d = addDays(d, 1), i++) {
    const col = i % 7, row = Math.floor(i / 7), X = 16 + col * cw, Y = top + row * ch, inM = d.slice(0, 7) === m.slice(0, 7);

  async imgSave(){ const b = SH.blob || await SH.blobP; const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = imgName(SH); document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); },
  async imgCopy(){
    try {
      if (!navigator.clipboard || !window.ClipboardItem) throw 0;
      await navigator.clipboard.write([new ClipboardItem({ "image/png": SH.blob || SH.blobP })]); toast("Картинка скопирована");
    } catch (e) { toast("Копирование не поддерживается — используйте «Поделиться»"); }
  }
};
async function joinFrom(code){
  const j = UI.jn; j.err = "";
  let inv; try { inv = JSON.parse(b64d(code)); } catch (e) { j.err = "Ссылка повреждена."; return render(); }
  const url = cleanUrl(inv.u); if (!url || !inv.r) { j.err = "Ссылка повреждена."; return render(); }
  try { const d = await cGet(url, inv.r); if (!d) throw new Error("Пространство не найдено. Попросите новую ссылку."); j.data = norm(d); j.url = url; j.room = inv.r; UI.scr = "join"; }
  catch (e) { j.err = e.message && !/fetch/i.test(e.message) ? e.message : "Нет связи с облаком. Проверьте интернет."; }
  render();
}

/* =================== привязка ввода =================== */
function setBind(path, val){
  const p = path.split("."); let o = p[0] === "sh" ? SH : UI; const ps = p[0] === "sh" ? p.slice(1) : p;
  for (let i = 0; i < ps.length - 1; i++) o = o[ps[i]];
  o[ps[ps.length - 1]] = val;
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === "A") e.preventDefault();
  fn(el, e);
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.bind) {
    let v = el.type === "checkbox" ? el.checked : el.value;
    if (el.dataset.n) v = v === "" ? (el.dataset.bind.endsWith("actual") ? null : v) : String(v).replace(",", ".");
    setBind(el.dataset.bind, v);
    if (el.dataset.bind === "sh.x.norm") SH.normTouched = true;
    if (SH && SH.type === "shift" && (el.dataset.bind === "sh.x.start" || el.dataset.bind === "sh.x.end") && !SH.normTouched) SH.x.norm = spanHours(SH.x.start, SH.x.end);
    if (el.type === "checkbox" && el.dataset.rr) render(true);
    if (el.type === "checkbox" && el.dataset.rs) renderSheet();
  }
  if (el.dataset.set && isMgr()) { // настройки — сохраняем с небольшой задержкой
    clearTimeout(el._t); el._t = setTimeout(() => {
      const k = el.dataset.set, isNum = el.type === "number";
      let v = isNum ? num(el.value) : el.value.trim(); if (k === "name" && !v) v = "Няня";
      write(`settings/${k.replace(".", "/")}`, v);
    }, 500);
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.rr) render(true);
  if (el.dataset.rs && el.type !== "checkbox") renderSheet();
  if (SH && SH.type === "shift" && el.dataset.bind === "sh.x.date") renderSheet();
  if (SH && SH.type === "img") return;
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches(".pin")) { e.preventDefault(); e.target.blur(); (ACT[UI.scr === "join" && UI.jn.data ? "login" : SH && SH.type === "pin" ? "savePin" : ""] || (() => {}))(); } });
$("#fileImp").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const d = norm(JSON.parse(await f.text()));
    if (!confirm(`Заменить все данные копией? Смен: ${Object.keys(d.shifts).length}, выплат: ${Object.keys(d.pays).length}.`)) return;
    d.settings.auth = D.settings.auth; d.settings.salt = D.settings.salt;
    for (const k of ["settings", "shifts", "off", "pays"]) write(k, d[k]);
    toast("Данные восстановлены"); render();
  } catch (err) { toast("Не удалось прочитать файл"); }
});

/* =================== PWA =================== */
if (PWA.web) {
  if (!document.querySelector('link[rel="manifest"]')) { const l = document.createElement("link"); l.rel = "manifest"; l.href = "manifest.webmanifest"; document.head.appendChild(l); }
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
addEventListener("beforeinstallprompt", e => { e.preventDefault(); PWA.deferred = e; if (UI.tab === "more") render(true); });
addEventListener("appinstalled", () => { PWA.deferred = null; toast("Приложение установлено"); if (UI.tab === "more") render(true); });

/* =================== старт =================== */
(function init(){
  applyTheme();
  if (S && S.room) { D = LS.get(dKey(), null); if (D) D = norm(D); }
  if (S && S.room && !D && !S.url) S = null;
  const m = location.hash.match(/join=([A-Za-z0-9_-]+)/);
  if (m) {
    history.replaceState(null, "", location.pathname + location.search);
    try { const inv = JSON.parse(b64d(m[1])); if (S && S.role && S.room === inv.r) { /* уже вошли в это пространство */ } else { UI.scr = "join"; render(); joinFrom(m[1]); return; } } catch (e) {}
  }
  if (S && S.role && D) { UI.tab = isMgr() ? "shifts" : "cal"; startLive(); }
  else if (S && S.room && D) { UI.scr = "welcome"; }
  render();
})();
</script>
